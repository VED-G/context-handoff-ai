services:
  - type: web
    name: context-handoff-ai
    runtime: docker
    plan: free
    region: oregon
    buildCommand: ""
    startCommand: ""
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FILE
        value: logs/app.log
      - key: AI_TIMEOUT_SECONDS
        value: "20"

